# Publica o jogo (modo local) no GitHub Pages a cada push na main.
# O modo sala precisa do servidor Node — não roda no Pages.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar pasta pública
        run: |
          mkdir -p _site/vendor _site/icons
          cp index.html play.html app.js data.js style.css sala.js play.js play.css sw.js manifest.webmanifest _site/
          cp vendor/*.js _site/vendor/
          cp icons/* _site/icons/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
